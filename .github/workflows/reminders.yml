name: Robin reminders (independent sender)

# Fires Robin's due reminders from GitHub's infrastructure, independent of the
# Render web service. Render-free sleeps/suspends, so its in-process scheduler
# can't be trusted to fire on time; this runner never sleeps.
on:
  schedule:
    # Every 5 minutes (UTC). GitHub may delay or occasionally skip a scheduled
    # run under load — that's fine: the sender fires EVERY reminder whose time
    # has already passed (remind_at <= now), so a missed run is caught up by the
    # next one. Reminders are delayed at worst, never lost.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # manual "Run workflow" button, for testing

# Don't let runs pile up if one is slow.
concurrency:
  group: robin-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        # Only what send_due_reminders.py transitively needs — pinned to match
        # requirements.txt. Avoids installing the heavy web/LLM stack. --retries
        # rides out the top-of-hour network blips that fail pip on GitHub's busy runners.
        run: pip install --retries 5 --timeout 60 "psycopg[binary]==3.2.13" "python-dotenv==1.0.1" "httpx==0.27.2" "python-dateutil==2.9.0"
      - name: Send due reminders (retry transient blips)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        # Retry the sender a few times in-run so a transient Neon cold-connect or
        # Telegram blip (common at the top of the hour, GitHub's busiest time)
        # doesn't fail the whole run and fire a nuisance failure email. Reminders
        # are still safe regardless — a fully failed run is caught up by the next
        # one 5 min later (remind_at <= NOW + the stale-'sending' reclaim).
        run: |
          for attempt in 1 2 3; do
            if python send_due_reminders.py; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "all 3 attempts failed"
          exit 1
